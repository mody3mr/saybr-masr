<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سايبر مصر</title>
    <link rel="stylesheet" href="style.css?v=12">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <!-- حاوية الإشعارات الاحترافية -->
    <div id="toast-container" class="toast-container"></div>

    <div class="auth-container">
        <div class="auth-box">
            <img src="Syber-Masr.PNG" alt="لوجو سايبر مصر" class="auth-logo">
            
            <div id="login-form">
                <h2>تسجيل الدخول</h2>
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
                <button onclick="loginUser()">دخول المنصة</button>
                <p class="auth-switch">ليس لديك حساب؟ <a href="#" onclick="toggleAuthMode('signup')">إنشاء حساب جديد</a></p>
            </div>

            <div id="signup-form" style="display: none;">
                <h2>إنشاء حساب جديد</h2>
                <input type="text" id="signupName" placeholder="الاسم بالكامل" required>
                <input type="tel" id="signupPhone" placeholder="رقم الموبايل" required>
                <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="signupPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" required>
                <button onclick="registerUser()">إنشاء حساب</button>
                <p class="auth-switch">لديك حساب بالفعل؟ <a href="#" onclick="toggleAuthMode('login')">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="app.js?v=12"></script>
</body>
</html>
