<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سايبر مصر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-box">
            <img src="6CE9AC26-6A5E-4ECE-B7AD-D1C57D10DD95.jpg" alt="لوجو سايبر مصر" class="auth-logo">
            <h2>تسجيل الدخول / إنشاء حساب</h2>
            <input type="text" id="userName" placeholder="اسم المستخدم (مثال: أحمد)" required>
            <input type="tel" id="userPhone" placeholder="رقم الموبايل" required>
            <button id="loginBtn" onclick="handleLogin()">دخول المنصة</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    
    <script>
        window.onload = () => {
            if(localStorage.getItem('cyberMasrUser')) {
                window.location.href = "main.html";
            }
        }
    </script>
</body>
</html>
