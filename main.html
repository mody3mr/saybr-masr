<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - سايبر مصر</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="top-header">
        <div class="header-right">
            <button id="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <!-- الروابط اتنقلت هنا جنب زرار القائمة -->
            <div class="top-links">
                <a href="#about" id="link-about">من نحن</a>
                <a href="#contact" id="link-contact">تواصل معنا</a>
                <a href="#privacy" id="link-privacy">سياسة الاستخدام</a>
            </div>
        </div>
        
        <div class="header-center">
            <img src="Syber-Masr.PNG" alt="Cyber Masr" class="nav-logo">
            <h1>سايبر مصر</h1>
        </div>

        <div class="header-left">
            <div class="notification-bell">
                <i class="fas fa-bell"></i>
                <span class="badge" id="noti-count">0</span>
            </div>
            <div class="user-profile" onclick="toggleDropdown()">
                <span id="display-username">جاري التحميل...</span>
                <i class="fas fa-user-circle"></i>
                <div class="dropdown-menu" id="user-dropdown">
                    <a href="#settings"><i class="fas fa-cog"></i> الإعدادات</a>
                    <a href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                </div>
            </div>
        </div>
    </header>

    <nav id="sidebar" class="sidebar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="ابحث هنا...">
        </div>
        <ul id="dynamic-tabs">
            <li><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</li>
        </ul>
    </nav>

    <main class="content-area">
        <div id="content-container">
            <div class="welcome-card">
                <h2><i class="fas fa-rocket"></i> أهلاً بك في منصة سايبر مصر</h2>
                <p>قم باختيار قسم من القائمة الجانبية للبدء. سيتم تحميل المحتوى والأقسام ديناميكياً من لوحة التحكم.</p>
            </div>
        </div>
    </main>

    <footer>
        <!-- حاوية ديناميكية للفوتر (سيتم ملؤها من الداش بورد لاحقاً) -->
        <div id="dynamic-footer-content" class="dynamic-footer">
            <!-- جافاسكريبت هيحط هنا السوشيال ميديا وأي بيانات تانية -->
        </div>
        
        <div class="copyright">
            تم الانشاء بواسطة <a href="https://wa.me/201000000000" target="_blank" class="dev-link">محمد عمرو ابراهيم</a> © 2026
        </div>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
