<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - سايبر مصر</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="top-header">
        <div class="header-right">
            <button id="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        </div>
        
        <div class="header-center">
            <!-- تم تعديل اسم الصورة هنا كمان -->
            <img src="Syber-Masr.PNG" alt="Cyber Masr" class="nav-logo">
            <h1>سايبر مصر</h1>
        </div>

        <div class="header-left">
            <div class="notification-bell">
                <i class="fas fa-bell"></i>
                <span class="badge" id="noti-count">3</span>
            </div>
            <div class="user-profile" onclick="toggleDropdown()">
                <span id="display-username">المستخدم</span>
                <i class="fas fa-user-circle"></i>
                <div class="dropdown-menu" id="user-dropdown">
                    <a href="#settings"><i class="fas fa-cog"></i> الإعدادات</a>
                    <a href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                </div>
            </div>
        </div>
    </header>

    <nav id="sidebar" class="sidebar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="ابحث هنا...">
        </div>
        <ul id="dynamic-tabs">
            <li><i class="fas fa-spinner fa-spin"></i> جاري تحميل الأقسام...</li>
        </ul>
    </nav>

    <main class="content-area">
        <div id="content-container">
            <h2>أهلاً بك في سايبر مصر</h2>
            <p>اختر قسماً من القائمة الجانبية للبدء.</p>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#about">من نحن</a>
            <a href="#contact">تواصل معنا</a>
            <a href="#privacy">سياسة الاستخدام</a>
        </div>
        <div class="social-icons" id="dynamic-social">
        </div>
        <div class="copyright">
            تم الانشاء بواسطة <a href="https://wa.me/201000000000" target="_blank" class="dev-link">محمد عمرو ابراهيم</a> © 2026
        </div>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    
    <script>
        window.onload = () => {
            const savedUser = localStorage.getItem('cyberMasrUser');
            if(!savedUser) {
                window.location.href = "index.html";
            } else {
                document.getElementById('display-username').innerText = savedUser;
            }
        }
    </script>
</body>
</html>
